aid: netbeez
name: Netbeez
description: >-
  NetBeez is a network performance monitoring platform that measures the
  end-user experience across distributed enterprise, remote-worker, and Wi-Fi
  networks. Hardware and software agents (including Raspberry Pi, Docker, and
  network-device-hosted agents on Cisco, Extreme, Cumulus, and Nutanix gear)
  run continuous and ad-hoc tests — ping, HTTP, DNS, traceroute, path analysis,
  Wi-Fi, and cellular — and report granular one-second-interval metrics to a
  central dashboard for real-time alerting and historical troubleshooting. The
  NetBeez API lets dashboard administrators integrate this telemetry with
  external tools, reporting, and analytics: a JSON-based v2 API documented on
  Postman at api.netbeez.net supports read and write operations (create targets,
  run ad-hoc tests), while a deprecated read-only v1 Swagger API is served
  per-instance. Alerting integrates outbound via webhooks and pre-built
  connectors for PagerDuty, Slack, Splunk, Microsoft Teams, ServiceNow, SNMP,
  syslog, and email. NetBeez was surfaced as a portfolio company of Partech.
